spring:
  config:
    import:
      - classpath:application-common.yml
      - classpath:application-rabbitmq.yml
  application:
    name: tracky-consumer
  datasource:
    hikari:
      maximum-pool-size: 7 # Consumer 모듈 전용 커넥션 풀 사이즈
  jpa:
    properties:
      hibernate:
        jdbc:
          batch_size: 10 # (600개 Bulk Insert)
        order_inserts: true
        order_updates: true

rabbitmq:
  batch:
    # 배치 리스너 관련 설정
    default-requeue-rejected: false
    enabled: true       # 배치 리스너 활성화
    size: 10            # 배치 크기(60*10=600개)
    timeout: 2000      # 타임아웃(ms) - 짧게 설정하여 메트릭 수집 빈도 향상
    consumer-batch-enabled: true  # 내부 배치 처리 기능 활성화

server:
  port: 8083

discord:
  enable: ${DISCORD_WEBHOOK_ENABLE:false}
  webhook-url: ${DISCORD_WEBHOOK_WEB_URL}

logging:
  level:
    org.springframework.web: INFO
    org.springframework.boot.actuate: INFO
    org.springframework.boot.actuate.endpoint.web: WARN  # actuator 엔드포인트 로깅 레벨을 WARN으로 설정

management:
  endpoints:
    web:
      exposure:
        # 'prometheus' 엔드포인트를 웹으로 노출시킵니다.
        include: prometheus
  metrics:
    tags:
      # 모든 메트릭에 공통 태그를 추가할 수 있습니다. (예: 애플리케이션 이름)
      application: tracky-consumer
    distribution:
      percentiles-histogram:
        gps.processing: true # gps.processing 타이머에 대해서만 히스토그램을 활성화합니다.
